        <div class="product-visuals" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="main-image-box" style="width: 100%; max-width: 580px;">

            <div class="thumbnail-gallery">

                <img src="3Filename.jpg" onclick="selectDesignAndImage('3Filename.jpg', 'luffy-radio')" alt="Luffy Hoodie">

            </div>
        </div>

            <h1 class="product-title">Hoodie Oversized Exclusive</h1>

                <span class="old-price">4,500 دج</span>
                <span class="current-price">3,600 دج</span>
            </div>

            <p class="product-desc">

            </p>

                    <input type="hidden" name="redirect" value="https://drop.ymsdz.com/thank-you.html">
                    
                    <!-- Hidden inputs to capture live shipping & total prices in email -->
                    <input type="hidden" name="shipping_price" id="hidden-shipping" value="400 دج">
                    <input type="hidden" name="total_price" id="hidden-total" value="4,000 دج">

                    <!-- 1. Name Field -->
                    <div class="input-group">
                        <label>الاسم الكامل *</label>
                        <input type="text" name="name" required placeholder="أدخل اسمك الكامل">
                    </div>

                    <!-- Phone Field -->
                    <div class="input-group">
                        <label>رقم الهاتف *</label>
                        <input type="tel" name="phone" required placeholder="أدخل رقم هاتفك" style="direction: rtl; text-align: right;">
                    </div>

                        <label>اختيار التصميم *</label>
                        <div class="options-grid design-selector">

                            </label>

                                <input type="radio" id="luffy-radio" name="design" value="Luffy Gear 5 Hoodie" onchange="changeImage('3Filename.jpg')">

                            </label>
                            <label class="radio-card">
                                <input type="radio" id="solo-radio" name="design" value="Solo Leveling Hoodie" onchange="changeImage('4Filename.jpg')"> 
                                Solo Leveling
                            </label>
                        </div>
                    </div>

                                <span class="swatch-circle" style="background-color: #ffffff;"></span>
                            </label>
                        </div>
                    </div>
